<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天使文本處理器 V4.5 - 雙軌剪貼簿版</title>
    <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: #f6d365; margin-bottom: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); letter-spacing: 1px; }
        .container { width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 20px; }
        
        .settings-panel, .excel-panel { background-color: #1e1e1e; padding: 20px; border-radius: 10px; border: 1px solid #333; display: flex; flex-direction: column; gap: 15px; }
        .excel-panel { border-color: #4facfe; position: relative; overflow: hidden; }

        .settings-row { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; font-size: 1.1em; cursor: pointer; }
        .checkbox-group input { width: 18px; height: 18px; cursor: pointer; }
        
        input[type="text"] { flex: 1; min-width: 250px; padding: 10px; border-radius: 6px; border: 1px solid #555; background-color: #2a2a2a; color: #fff; font-family: inherit; font-size: 0.9rem; }
        textarea { width: 100%; min-height: 150px; resize: vertical; box-sizing: border-box; line-height: 1.6; padding: 15px; border-radius: 6px; border: 1px solid #555; background-color: #2a2a2a; color: #fff; font-family: inherit; font-size: 1rem; tab-size: 4; }
        textarea:focus { outline: none; border-color: #f6d365; }
        
        button { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); color: #121212; border: none; padding: 12px 25px; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { filter: brightness(1.1); transform: translateY(-2px); box-shadow: 0 4px 8px rgba(246, 211, 101, 0.3); }
        button:active { transform: translateY(0); }
        
        .btn-success { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: #121212; }
        .btn-excel { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: #121212; }
        .btn-load { background: #444; color: #fff; padding: 10px 15px; font-size: 0.9rem; }
        .btn-edit { background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%); color: #fff; padding: 10px 15px; font-size: 0.9rem; text-decoration: none; border-radius: 6px; font-weight: bold; transition: 0.2s; display: inline-block; text-align: center; }
        .btn-edit:hover { filter: brightness(1.1); transform: translateY(-2px); box-shadow: 0 4px 8px rgba(155, 89, 182, 0.3); }
        
        .qc-panel { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); border: 1px solid #4facfe; padding: 15px 20px; border-radius: 8px; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .qc-highlight { color: #f6d365; font-weight: bold; font-size: 1.2em; margin: 0 5px; }

        .output-panel { background-color: #ffffff; color: #000000; padding: 20px; border-radius: 8px; min-height: 150px; font-size: 1rem; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow-y: auto; max-height: 400px; border: 2px solid #555; }
        #outputHtml table { width: 100%; border-collapse: collapse; }
        #outputHtml td { padding: 4px 10px; border: 1px dashed #ddd; vertical-align: top; white-space: pre-wrap; word-break: break-all; }
        
        .status-msg { font-size: 1em; font-weight: bold; }
        #diagnosticReport { background-color: #2a0000; color: #ff8888; border: 1px dashed #ff4444; padding: 10px 15px; border-radius: 6px; font-size: 0.9em; display: none; line-height: 1.6; }
        #diagnosticReport ul { margin: 5px 0 0 0; padding-left: 20px; }
        input[type="file"]::file-selector-button { padding: 8px 16px; border-radius: 4px; border: none; background-color: #444; color: white; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <h1>👼 天使文本處理器 V4.5</h1>

    <div class="container">
        <div class="settings-panel">
            <h3 style="margin: 0; color: #aaa;">⚙️ 處理規則設定</h3>
            <div class="settings-row">
                <label class="checkbox-group"><input type="checkbox" id="chkS2T" checked> 1️⃣ 執行：簡體轉繁體 <span id="s2tStatus" style="font-size: 0.8em; color:#a8ff78;"></span></label>
            </div>
            <div class="settings-row">
                <label class="checkbox-group"><input type="checkbox" id="chkDict" checked> 2️⃣ 執行：自動套用雲端字庫 (僅標示有更動的紅字)</label>
            </div>
            
            <div class="settings-row" style="background: rgba(0,0,0,0.2); padding: 10px; border-radius: 6px;">
                <span>🔗 CSV 網址：</span>
                <input type="text" id="csvUrlInput" placeholder="請貼上「發佈到網路」的 CSV 網址...">
                <button class="btn-load" onclick="loadDictionary()">🔄 重新連線</button>
                <a href="https://docs.google.com/spreadsheets/d/1dvT2ixcPhVBCn544zP2k5TLsy3T4yFFU/edit" target="_blank" class="btn-edit">📝 前往編輯字庫</a>
            </div>
            
            <div class="settings-row">
                <span>📚 雲端字庫狀態：</span>
                <span id="dictStatus" class="status-msg">等待連線...</span>
            </div>
            <div id="diagnosticReport"></div>
            <div class="settings-row" style="background: rgba(0,0,0,0.2); padding: 10px; border-radius: 6px;">
                <button class="btn-load" onclick="compareTwp()">🔍 比對台灣用語（cn→twp）並匯出</button>
                <span style="font-size: 0.85em; color: #aaa;">針對最近一次處理的內容，找出台灣用語轉換會改寫、但雲端字庫還沒處理的詞，匯出成字庫格式的 Excel</span>
            </div>
            <span id="twpStatus" class="status-msg"></span>
        </div>

        <div class="excel-panel">
            <h3 style="margin: 0; color: #4facfe;">📊 檔案批次處理（xlsx／csv／txt）</h3>
            <div class="settings-row" style="margin-top: 10px;">
                <input type="file" id="excelFile" accept=".xlsx,.csv,.txt">
                <button class="btn-excel" onclick="processExcel()">🚀 轉換並下載檔案</button>
            </div>
            <span id="excelStatus" style="color: #a8ff78; font-weight: bold;"></span>
        </div>

        <hr style="width: 100%; border-color: #333;">

        <h3 style="margin: 0; color: #f6d365;">📝 純文字快速處理</h3>
        <div><textarea id="sourceText" placeholder="請貼上文字 (內含的 <color> 或 {0} 等代碼將受到智能防護)..."></textarea></div>
        <div style="text-align: center;"><button onclick="processText()">✨ 開始淨化文字</button></div>
        
        <div id="qcReportPanel" class="qc-panel">
            <h4 style="margin: 0 0 10px 0; color: #a8ff78;">📊 淨化品質管理報告 (QC)</h4>
            <div id="qcReportContent" style="font-size: 0.95em; line-height: 1.6;"></div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: flex-end;">
            <h3 style="margin: 0; color: #f6d365;">預覽區：</h3>
            <button class="btn-success" onclick="copyRichText()">📋 複製格式結果 (完美支援「只貼上值」)</button>
        </div>
        <div id="outputHtml" class="output-panel">處理後的結果將顯示於此...</div>
    </div>

    <script>
        // 代碼保護：只保護單行內、不跨引號的 <tag> 與 {0} 佔位符，避免把整段 Lua table 誤判成代碼
        const PROTECT_REGEX = /<[^<>\n"]*>|\{[^{}\n"]*\}/g;
        const RED_FONT = { color: { argb: 'FFFF0000' }, bold: true };
        let converterS2T = null;
        let replaceDict = {};
        let searchRegex = null;
        let lastSourceText = '';   // 最近一次處理的原文（供「比對台灣用語」使用）

        let qcStats = { charCount: 0, replaceCount: 0, wordFreq: {} };

        window.onload = async function() {
            const s2tStatus = document.getElementById('s2tStatus');
            const urlInput = document.getElementById('csvUrlInput');
            urlInput.value = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSfuEzU_l8vOO-cbC_mQHBPEc9vpeOSqw4S5mv2D5xAJ2heBohMgr7aOzchLy8e6A/pub?gid=900428424&single=true&output=csv";

            try {
                if (typeof OpenCC !== 'undefined') {
                    converterS2T = OpenCC.Converter({ from: 'cn', to: 'tw' });
                    s2tStatus.innerText = "(✅ 就緒)";
                }
            } catch (e) { console.error('OpenCC 初始化失敗：', e); }

            await loadDictionary();
        };

        // ===== 共用小工具 =====
        function escHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function downloadBlob(blob, fileName) {
            const downloadUrl = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl; a.download = fileName;
            document.body.appendChild(a); a.click(); a.remove(); window.URL.revokeObjectURL(downloadUrl);
        }

        // 簡轉繁（保護 <tag> 與 {0}）
        function s2tProtected(text, useS2T) {
            if (!useS2T || !converterS2T) return text;
            const protectedTags = [];
            const masked = text.replace(PROTECT_REGEX, (match) => {
                protectedTags.push(match);
                return `⟪TAG${protectedTags.length - 1}⟫`;
            });
            return converterS2T(masked).replace(/⟪TAG(\d+)⟫/g, (match, p1) => protectedTags[parseInt(p1)]);
        }

        // ===== 轉換核心：三條流程（純文字／CSV・TXT／Excel）共用 =====
        // runs：[{ text, font }]，Excel 局部格式的儲存格會有多段，其他情況只有一段
        // 回傳 runs（替換處 replaced=true、字型加紅加粗）、純文字結果、是否有實質替換
        function convertRuns(runs, useS2T, useDict) {
            const conv = runs.map(r => ({ text: s2tProtected(r.text || '', useS2T), font: r.font }));
            const full = conv.map(r => r.text).join('');
            const fontAt = [];
            conv.forEach(r => { for (let i = 0; i < r.text.length; i++) fontAt.push(r.font); });

            // 代碼所在範圍不做字庫替換
            const protectedRanges = [];
            for (const m of full.matchAll(PROTECT_REGEX)) protectedRanges.push([m.index, m.index + m[0].length]);

            const out = [];
            let last = 0, changed = false;
            // 未替換的片段沿用原本的字型（同字型的字併成一段）
            const pushSegment = (start, end) => {
                let i = start;
                while (i < end) {
                    let j = i + 1;
                    while (j < end && fontAt[j] === fontAt[i]) j++;
                    out.push({ text: full.substring(i, j), font: fontAt[i] });
                    i = j;
                }
            };

            if (useDict && searchRegex) {
                const re = new RegExp(searchRegex.source, 'g');
                let m;
                while ((m = re.exec(full)) !== null) {
                    const s = m.index, e = s + m[0].length;
                    if (protectedRanges.some(([a, b]) => s < b && e > a)) continue;
                    const word = replaceDict[m[0]];
                    if (word === undefined || word === m[0]) continue;
                    pushSegment(last, s);
                    out.push({ text: word, font: Object.assign({}, fontAt[s] || {}, RED_FONT), replaced: true });
                    recordReplace(word);
                    changed = true;
                    last = e;
                }
            }
            pushSegment(last, full.length);
            return { runs: out, plain: out.map(r => r.text).join(''), changed };
        }

        function runsToHtml(runs) {
            return runs.map(r => r.replaced
                ? `<span style="color: #ff0000; font-weight: bold;">${escHtml(r.text)}</span>`
                : escHtml(r.text)).join('');
        }

        // 預覽區：以換行分列、Tab 分欄，貼到 Excel 時能對齊
        function renderPreview(html, plainText) {
            let htmlTable = '<table style="border-collapse: collapse; border: none; width: 100%;">';
            for (const row of html.split(/\r?\n/)) {
                htmlTable += '<tr>';
                for (const cell of row.split('\t')) {
                    htmlTable += `<td style="border: none; white-space: pre-wrap; mso-number-format: '\\@';">${cell === "" ? "<br>" : cell}</td>`;
                }
                htmlTable += '</tr>';
            }
            htmlTable += '</table>';
            document.getElementById('outputHtml').innerHTML = htmlTable;
            window.lastProcessedPlainText = plainText;
        }

        // ===== QC 報告 =====
        function resetQC() {
            qcStats = { charCount: 0, replaceCount: 0, wordFreq: {} };
            document.getElementById('qcReportPanel').style.display = 'none';
        }

        function recordReplace(word) {
            qcStats.replaceCount++;
            qcStats.wordFreq[word] = (qcStats.wordFreq[word] || 0) + 1;
        }

        function displayQC() {
            const sortedWords = Object.entries(qcStats.wordFreq).sort((a, b) => b[1] - a[1]);
            let topWordsHtml = sortedWords.slice(0, 5).map(item => `「${escHtml(item[0])}」(${item[1]}次)`).join('、');
            if (topWordsHtml === '') topWordsHtml = '無觸發實質替換';

            document.getElementById('qcReportContent').innerHTML = `
                🔹 本次共掃描：<span class="qc-highlight">${qcStats.charCount}</span> 字<br>
                🔹 發生實質替換：<span class="qc-highlight">${qcStats.replaceCount}</span> 個詞彙<br>
                🔹 最常被替換的詞 (Top 5)：<span style="color:#fff;">${topWordsHtml}</span>
            `;
            document.getElementById('qcReportPanel').style.display = 'block';
        }

        // ===== 雲端字庫 =====
        function parseCSVRow(str) {
            let result = [], cell = '', inQuotes = false;
            for (let i = 0; i < str.length; i++) {
                let char = str[i];
                if (char === '"' && str[i+1] === '"') { cell += '"'; i++; }
                else if (char === '"') { inQuotes = !inQuotes; }
                else if (char === ',' && !inQuotes) { result.push(cell); cell = ''; }
                else { cell += char; }
            }
            result.push(cell);
            return result.map(c => c.trim());
        }

        async function loadDictionary() {
            const statusLabel = document.getElementById('dictStatus');
            const reportDiv = document.getElementById('diagnosticReport');
            const url = document.getElementById('csvUrlInput').value.trim();

            reportDiv.style.display = "none";
            reportDiv.innerHTML = "";
            if (!url) return;
            statusLabel.innerText = "⏳ 連線中...";
            statusLabel.style.color = "#f6d365";

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`伺服器回應 HTTP ${response.status}`);
                const csvData = await response.text();
                if (/^\s*<(!doctype|html)/i.test(csvData)) {
                    throw new Error('收到的是網頁而不是 CSV，請確認網址是「發佈到網路」的 CSV 連結');
                }
                const lines = csvData.split(/\r?\n/).filter(line => line.trim() !== "");

                // 先讀進暫存，確認成功後才換掉目前使用中的字庫
                const explicit = new Map();   // 字庫裡明確寫的搜尋字 → { value, row }
                const duplicateWarnings = [];
                const conflictWarnings = [];
                const invalidWarnings = [];

                for (let i = 1; i < lines.length; i++) {
                    const row = parseCSVRow(lines[i]);
                    const rowNum = i + 1;
                    if (row.length < 2 || row[0] === "" || row[1] === "") {
                        invalidWarnings.push(`第 ${rowNum} 行：缺少 A 欄或 B 欄資料`);
                        continue;
                    }
                    const key = row[0], value = row[1];
                    if (explicit.has(key)) {
                        const prev = explicit.get(key);
                        const same = prev.value === value ? '（替換字相同）' : `（替換字不同：「${prev.value}」vs「${value}」，以第 ${rowNum} 行為準）`;
                        duplicateWarnings.push(`第 ${rowNum} 行：搜尋字「${key}」與第 ${prev.row} 行重複${same}`);
                    }
                    explicit.set(key, { value, row: rowNum });
                }

                const newDict = {};
                explicit.forEach((info, key) => { newDict[key] = info.value; });

                // 自動補上繁體版搜尋字；字庫裡明確寫的條目優先，不會被自動產生的蓋掉
                const autoFrom = new Map();   // 自動產生的繁體 key → 來源 { key, row }
                if (converterS2T) {
                    explicit.forEach((info, key) => {
                        const tradKey = converterS2T(key);
                        if (tradKey === key) return;
                        if (explicit.has(tradKey)) {
                            const other = explicit.get(tradKey);
                            if (other.value !== info.value) {
                                conflictWarnings.push(`第 ${info.row} 行「${key}」轉繁後是「${tradKey}」，與第 ${other.row} 行衝突（「${info.value}」vs「${other.value}」），繁體文字會以第 ${other.row} 行為準`);
                            }
                            return;
                        }
                        if (autoFrom.has(tradKey)) {
                            const first = autoFrom.get(tradKey);
                            if (newDict[tradKey] !== info.value) {
                                conflictWarnings.push(`第 ${first.row} 行「${first.key}」與第 ${info.row} 行「${key}」轉繁後都是「${tradKey}」，但替換字不同（「${newDict[tradKey]}」vs「${info.value}」），以第 ${first.row} 行為準`);
                            }
                            return;
                        }
                        autoFrom.set(tradKey, { key, row: info.row });
                        newDict[tradKey] = info.value;
                    });
                }

                const sortedWords = Object.keys(newDict).sort((a, b) => b.length - a.length);
                replaceDict = newDict;
                searchRegex = sortedWords.length > 0 ? new RegExp(sortedWords.map(escapeRegExp).join('|'), 'g') : null;

                const problemCount = duplicateWarnings.length + conflictWarnings.length;
                if (explicit.size === 0) {
                    statusLabel.innerText = "⚠️ 已連線，但字庫沒有任何有效資料（本次不會進行字庫替換）";
                    statusLabel.style.color = "#f6d365";
                } else if (problemCount > 0) {
                    statusLabel.innerText = `⚠️ 同步成功（有效資料 ${explicit.size} 筆），但發現 ${problemCount} 處重複／衝突，請看下方報告`;
                    statusLabel.style.color = "#f6d365";
                } else {
                    statusLabel.innerText = `✅ 同步成功！(有效資料共 ${explicit.size} 筆，無重複)`;
                    statusLabel.style.color = "#a8ff78";
                }

                if (problemCount > 0 || invalidWarnings.length > 0) {
                    reportDiv.style.display = "block";
                    let reportHtml = `<strong>🕵️ 系統診斷報告：</strong><ul>`;
                    duplicateWarnings.forEach(msg => reportHtml += `<li>⚠️ ${escHtml(msg)}</li>`);
                    conflictWarnings.forEach(msg => reportHtml += `<li>🔀 ${escHtml(msg)}</li>`);
                    invalidWarnings.forEach(msg => reportHtml += `<li>❌ ${escHtml(msg)}</li>`);
                    reportHtml += "</ul>";
                    reportDiv.innerHTML = reportHtml;
                }
            } catch (error) {
                console.error('字庫載入失敗：', error);
                const keep = searchRegex ? '目前沿用上次成功載入的字庫' : '目前沒有可用的字庫';
                statusLabel.innerText = `❌ 載入失敗：${error.message}（${keep}）`;
                statusLabel.style.color = "#ff4444";
            }
        }

        // ===== 純文字快速處理 =====
        function processText() {
            resetQC();
            const originalInput = document.getElementById('sourceText').value;
            const useS2T = document.getElementById('chkS2T').checked;
            const useDict = document.getElementById('chkDict').checked;
            const outputDiv = document.getElementById('outputHtml');

            if (!originalInput.trim()) { outputDiv.innerHTML = "<span style='color:red;'>請先貼上文字！</span>"; return; }

            qcStats.charCount = originalInput.length;
            lastSourceText = originalInput;
            const result = convertRuns([{ text: originalInput }], useS2T, useDict);
            renderPreview(runsToHtml(result.runs), result.plain);
            displayQC();
        }

        async function copyRichText() {
            const outputDiv = document.getElementById('outputHtml');
            if (!outputDiv.innerHTML.includes("<table")) {
                alert("請先點擊「開始淨化文字」喔！");
                return;
            }

            const rawHtml = outputDiv.innerHTML;
            const cleanPlainText = window.lastProcessedPlainText || outputDiv.innerText;

            try {
                // 雙軌寫入：網頁格式 + 純文字格式
                const clipboardItem = new ClipboardItem({
                    "text/html": new Blob([rawHtml], { type: "text/html" }),
                    "text/plain": new Blob([cleanPlainText], { type: "text/plain" })
                });
                await navigator.clipboard.write([clipboardItem]);
                alert("✅ 複製成功！現在不管是直接貼上(保留紅字)，還是「只貼上值」(完美對齊)，都能完美支援囉！");
            } catch (error) {
                console.error('複製失敗：', error);
                alert("❌ 瀏覽器可能不支援進階剪貼簿功能，請確認是否有開啟相關權限。");
            }
        }

        // ===== 檔案批次處理 =====
        // 📄 CSV / TXT：整份當純文字處理，保留原本的換行與分隔符號
        async function processTextFile(file, useS2T, useDict) {
            const bytes = new Uint8Array(await file.arrayBuffer());
            const hasBOM = bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF;
            let encoding = 'UTF-8';
            let content;
            try {
                content = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
            } catch (e) {
                // 不是合法 UTF-8 時，改用 GB18030（相容 GBK／GB2312）解讀簡體檔案
                content = new TextDecoder('gb18030').decode(bytes);
                encoding = 'GB18030';
            }
            if (content.charCodeAt(0) === 0xFEFF) content = content.slice(1);
            qcStats.charCount += content.length;
            lastSourceText = content;

            const result = convertRuns([{ text: content }], useS2T, useDict);
            renderPreview(runsToHtml(result.runs), result.plain);

            const isCSV = /\.csv$/i.test(file.name);
            // 原檔有 BOM 就保留；GB18030 來源的 CSV 加上 BOM，讓 Excel 能正確辨識 UTF-8
            const addBOM = hasBOM || (isCSV && encoding !== 'UTF-8');
            const blob = new Blob([(addBOM ? '﻿' : '') + result.plain], { type: (isCSV ? 'text/csv' : 'text/plain') + ';charset=utf-8' });
            downloadBlob(blob, "天使淨化版_" + file.name);
            return encoding;
        }

        // 📊 Excel：純文字儲存格與「局部格式」儲存格都會處理，原本的字型格式會保留
        async function processExcelFile(file, useS2T, useDict) {
            const workbook = new ExcelJS.Workbook();
            await workbook.xlsx.load(await file.arrayBuffer());
            const sourceTexts = [];

            workbook.eachSheet((worksheet) => {
                worksheet.eachRow((row) => {
                    row.eachCell((cell) => {
                        let runs;
                        const isRich = cell.type === ExcelJS.ValueType.RichText;
                        if (cell.type === ExcelJS.ValueType.String) {
                            runs = [{ text: cell.value }];
                        } else if (isRich && cell.value && Array.isArray(cell.value.richText)) {
                            runs = cell.value.richText.map(r => ({ text: r.text || '', font: r.font }));
                        } else {
                            return;
                        }
                        const original = runs.map(r => r.text).join('');
                        qcStats.charCount += original.length;
                        sourceTexts.push(original);

                        const result = convertRuns(runs, useS2T, useDict);
                        if (isRich || result.changed) {
                            cell.value = { richText: result.runs.map(r => r.font ? { text: r.text, font: r.font } : { text: r.text }) };
                        } else {
                            cell.value = result.plain;
                        }
                    });
                });
            });

            lastSourceText = sourceTexts.join('\n');
            const buffer = await workbook.xlsx.writeBuffer();
            downloadBlob(new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), "天使淨化版_" + file.name);
        }

        async function processExcel() {
            const fileInput = document.getElementById('excelFile');
            const statusBox = document.getElementById('excelStatus');
            const useS2T = document.getElementById('chkS2T').checked;
            const useDict = document.getElementById('chkDict').checked;

            if (fileInput.files.length === 0) {
                statusBox.innerText = "⚠️ 請先選擇要轉換的檔案（xlsx／csv／txt）";
                statusBox.style.color = "#f6d365";
                return;
            }
            const file = fileInput.files[0];
            if (!/\.(xlsx|csv|txt)$/i.test(file.name)) {
                statusBox.innerText = "⚠️ 只支援 xlsx、csv、txt 檔案";
                statusBox.style.color = "#f6d365";
                return;
            }
            statusBox.innerText = "⏳ 正在啟動天使引擎讀取檔案..."; statusBox.style.color = "#f6d365";
            resetQC();

            try {
                if (/\.(csv|txt)$/i.test(file.name)) {
                    const encoding = await processTextFile(file, useS2T, useDict);
                    statusBox.innerText = encoding === 'UTF-8'
                        ? "✅ 轉換成功！請查看下載資料夾，結果也已顯示在預覽區。"
                        : `✅ 轉換成功！原檔判斷為 ${encoding}，已輸出為 UTF-8。結果也已顯示在預覽區。`;
                } else {
                    await processExcelFile(file, useS2T, useDict);
                    statusBox.innerText = "✅ 轉換成功！請查看下載資料夾。";
                }
                statusBox.style.color = "#a8ff78";
                displayQC();
            } catch (error) {
                console.error('檔案處理失敗：', error);
                statusBox.innerText = `❌ 處理發生錯誤：${error.message}`;
                statusBox.style.color = "#ff4444";
            }
        }

        // ===== 比對台灣用語（cn → twp） =====
        // 找出「台灣用語轉換會改寫、但雲端字庫還沒處理」的詞，匯出成字庫格式的 Excel
        let twpTools = null;
        function getTwpTools() {
            if (twpTools) return twpTools;
            if (typeof OpenCC === 'undefined' || !OpenCC.Locale || !OpenCC.Locale.to.twp) return null;
            const phraseKeys = new Set();
            OpenCC.Locale.to.twp.slice(1).join('|').split('|').forEach(pair => {
                const key = pair.split(' ')[0];
                if (key) phraseKeys.add(key);
            });
            const keys = [...phraseKeys].sort((a, b) => b.length - a.length);
            twpTools = {
                cnToStd: OpenCC.Converter({ from: 'cn', to: 't' }),
                stdToTwp: OpenCC.Converter({ from: 't', to: 'twp' }),
                phraseRegex: new RegExp(keys.map(escapeRegExp).join('|'), 'g')
            };
            return twpTools;
        }

        async function compareTwp() {
            const statusBox = document.getElementById('twpStatus');
            const tools = getTwpTools();
            if (!tools || !converterS2T) {
                statusBox.innerText = "❌ OpenCC 尚未載入，無法比對";
                statusBox.style.color = "#ff4444";
                return;
            }
            if (!lastSourceText.trim()) {
                statusBox.innerText = "⚠️ 請先處理一段文字或一個檔案，再進行比對";
                statusBox.style.color = "#f6d365";
                return;
            }

            try {
                // 代碼換成等長的佔位，避免影響位置對應
                const masked = lastSourceText.replace(PROTECT_REGEX, (m) => '\u0001'.repeat(m.length));
                const std = tools.cnToStd(masked);
                const tw = converterS2T(masked);
                if (std.length !== tw.length) throw new Error('轉換後長度不一致，無法比對');
                const sameLength = masked.length === std.length;

                // 雲端字庫已涵蓋的位置（包含「替換字＝搜尋字」的保留條目）
                const covered = [];
                if (searchRegex) {
                    for (const m of tw.matchAll(new RegExp(searchRegex.source, 'g'))) covered.push([m.index, m.index + m[0].length]);
                }

                const found = new Map();
                for (const m of std.matchAll(tools.phraseRegex)) {
                    const s = m.index, e = s + m[0].length;
                    const twForm = tw.substring(s, e);
                    const twpForm = tools.stdToTwp(m[0]);
                    if (twpForm === twForm) continue;
                    if (covered.some(([a, b]) => s < b && e > a)) continue;
                    if (!found.has(twForm)) {
                        const lineStart = tw.lastIndexOf('\n', s) + 1;
                        let lineEnd = tw.indexOf('\n', e); if (lineEnd === -1) lineEnd = tw.length;
                        const from = Math.max(lineStart, s - 15), to = Math.min(lineEnd, e + 15);
                        found.set(twForm, {
                            suggest: twpForm,
                            simplified: sameLength ? masked.substring(s, e) : '',
                            count: 0,
                            example: tw.substring(from, to).replace(/\u0001+/g, '…').trim()
                        });
                    }
                    found.get(twForm).count++;
                }

                if (found.size === 0) {
                    statusBox.innerText = "✅ 沒有發現雲端字庫尚未涵蓋的台灣用語差異";
                    statusBox.style.color = "#a8ff78";
                    return;
                }

                const items = [...found.entries()].sort((a, b) => b[1].count - a[1].count);
                const workbook = new ExcelJS.Workbook();
                const sheet = workbook.addWorksheet('待新增字庫');
                sheet.columns = [
                    { header: '搜尋字', width: 16 },
                    { header: '替換字（台灣用語建議）', width: 22 },
                    { header: '簡體原文', width: 14 },
                    { header: '出現次數', width: 10 },
                    { header: '例句', width: 60 }
                ];
                items.forEach(([twForm, info]) => sheet.addRow([twForm, info.suggest, info.simplified, info.count, info.example]));
                sheet.getRow(1).font = { bold: true };
                const buffer = await workbook.xlsx.writeBuffer();
                downloadBlob(new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), "台灣用語比對_待新增字庫.xlsx");

                const total = items.reduce((sum, [, info]) => sum + info.count, 0);
                statusBox.innerText = `✅ 找到 ${items.length} 個詞（共 ${total} 處），已匯出 Excel，請人工確認後再更新到雲端字庫`;
                statusBox.style.color = "#a8ff78";
            } catch (error) {
                console.error('台灣用語比對失敗：', error);
                statusBox.innerText = `❌ 比對失敗：${error.message}`;
                statusBox.style.color = "#ff4444";
            }
        }
    </script>
