<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>圖片轉文字 OCR 工具</title>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --danger: #dc2626;
      --ok: #16a34a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 32px 16px 64px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .sub {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.6;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
      padding: 20px;
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }

    input[type="text"], select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      background: #fff;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .hint {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .dropzone {
      border: 2px dashed #cbd5e1;
      border-radius: 18px;
      padding: 34px 18px;
      text-align: center;
      background: #f8fafc;
      transition: 0.15s ease;
      cursor: pointer;
    }

    .dropzone.dragover {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .dropzone strong {
      display: block;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .dropzone span {
      color: var(--muted);
      font-size: 14px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 16px;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s ease;
    }

    button.primary {
      color: white;
      background: var(--primary);
    }

    button.primary:hover { background: var(--primary-dark); }

    button.secondary {
      color: var(--text);
      background: #eef2ff;
    }

    button.secondary:hover { background: #e0e7ff; }

    button.danger {
      color: white;
      background: var(--danger);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .progress-wrap { margin-top: 14px; }

    .progress-bg {
      height: 12px;
      border-radius: 999px;
      background: #e5e7eb;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--primary);
      transition: width 0.2s ease;
    }

    .status {
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .file-list {
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      max-height: 280px;
      overflow-y: auto;
    }

    .file-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }

    .file-item:last-child { border-bottom: 0; }

    .file-item .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-item .state {
      color: var(--muted);
      white-space: nowrap;
    }

    .file-item.done .state {
      color: var(--ok);
      font-weight: 700;
    }

    .file-item.fail .state {
      color: var(--danger);
      font-weight: 700;
    }

    textarea {
      width: 100%;
      min-height: 260px;
      resize: vertical;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.65;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans Mono CJK TC", monospace;
    }

    .footer-note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    @media (max-width: 720px) {
      .controls { grid-template-columns: 1fr; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>圖片轉文字 OCR 工具</h1>
    <p class="sub">
      支援拖曳 ZIP、PNG、JPG、JPEG。辨識完成後可下載 CSV，或下載包含「檔名、原圖、文字內容」的 XLSX Excel 報表。
    </p>

    <section class="card">
      <label for="apiUrl">OCR 後端 API 網址</label>
      <input
        id="apiUrl"
        type="text"
        placeholder="例如：https://你的-huggingface-space.hf.space/ocr"
        value="https://190boy-image-ocr-api.hf.space/ocr"
      />
      <div class="hint">
        已預設填入你的 Hugging Face Spaces OCR API。若之後更換 Space，再改這裡即可。
      </div>

      <div class="controls">
        <div>
          <label for="outputMode">輸出文字模式</label>
          <select id="outputMode">
            <option value="original">保持 OCR 原文</option>
            <option value="traditional">轉成繁體中文（需後端支援）</option>
            <option value="simplified">轉成簡體中文（需後端支援）</option>
          </select>
        </div>

        <div>
          <label for="langMode">辨識語言</label>
          <select id="langMode">
            <option value="ch">中文 + 英文</option>
            <option value="en">英文</option>
          </select>
        </div>
      </div>
    </section>

    <section class="card">
      <div id="dropzone" class="dropzone">
        <strong>把 ZIP / 圖片拖曳到這裡</strong>
        <span>或點擊選擇檔案，可一次選多張 PNG / JPG / JPEG</span>
      </div>
      <input id="fileInput" type="file" multiple accept=".zip,.png,.jpg,.jpeg,image/png,image/jpeg" hidden />

      <div class="btn-row">
        <button id="startBtn" class="primary" disabled>開始辨識</button>
        <button id="clearBtn" class="secondary" disabled>清除檔案</button>
        <button id="cancelBtn" class="danger" disabled>中止</button>
      </div>

      <div class="progress-wrap">
        <div class="progress-bg">
          <div id="progressBar" class="progress-bar"></div>
        </div>
        <div id="status" class="status">尚未選擇檔案。</div>
      </div>

      <div id="fileList" class="file-list" hidden></div>
    </section>

    <section class="card">
      <label for="resultText">辨識結果預覽</label>
      <textarea id="resultText" placeholder="辨識完成後，預覽結果會顯示在這裡；下載時可輸出 CSV 或 XLSX。"></textarea>

      <div class="btn-row">
        <button id="downloadBtn" class="primary" disabled>下載 CSV</button>
        <button id="downloadXlsxBtn" class="primary" disabled>下載 Excel 報表（含圖片）</button>
        <button id="copyBtn" class="secondary" disabled>複製預覽結果</button>
      </div>
    </section>

    <p class="footer-note">
      注意：圖片會送到你填入的 OCR 後端 API。若你使用免費 Hugging Face Spaces，第一次請求可能會因服務休眠而比較慢。XLSX 會在你的瀏覽器本機產生，圖片不會另外上傳到其他地方。
    </p>
  </main>

  <script>
    const apiUrlInput = document.getElementById("apiUrl");
    const outputModeSelect = document.getElementById("outputMode");
    const langModeSelect = document.getElementById("langMode");
    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("fileInput");
    const startBtn = document.getElementById("startBtn");
    const clearBtn = document.getElementById("clearBtn");
    const cancelBtn = document.getElementById("cancelBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const downloadXlsxBtn = document.getElementById("downloadXlsxBtn");
    const copyBtn = document.getElementById("copyBtn");
    const progressBar = document.getElementById("progressBar");
    const statusEl = document.getElementById("status");
    const fileListEl = document.getElementById("fileList");
    const resultText = document.getElementById("resultText");

    let imageFiles = [];
    let isCancelled = false;
    let reportRows = [];

    const IMAGE_EXT_RE = /\.(png|jpg|jpeg)$/i;

    function naturalSort(a, b) {
      return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" });
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function setProgress(done, total) {
      const percent = total ? Math.round((done / total) * 100) : 0;
      progressBar.style.width = percent + "%";
    }

    function updateButtons() {
      const hasFiles = imageFiles.length > 0;
      const hasResult = resultText.value.trim();
      startBtn.disabled = !hasFiles;
      clearBtn.disabled = !hasFiles;
      downloadBtn.disabled = !hasResult;
      downloadXlsxBtn.disabled = !hasResult || reportRows.length === 0;
      copyBtn.disabled = !hasResult;
    }

    function renderFileList(states = {}) {
      fileListEl.innerHTML = "";
      fileListEl.hidden = imageFiles.length === 0;

      for (const file of imageFiles) {
        const row = document.createElement("div");
        const state = states[file.name] || "等待中";
        row.className = "file-item";

        if (state === "完成") row.classList.add("done");
        if (state === "失敗") row.classList.add("fail");

        row.innerHTML = `
          <div class="name" title="${escapeHtml(file.name)}">${escapeHtml(file.name)}</div>
          <div class="state">${escapeHtml(state)}</div>
        `;

        fileListEl.appendChild(row);
      }
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function handleFiles(fileList) {
      const incoming = Array.from(fileList);
      const collected = [];

      setStatus("正在讀取檔案...");

      for (const file of incoming) {
        if (/\.zip$/i.test(file.name)) {
          const zipImages = await extractImagesFromZip(file);
          collected.push(...zipImages);
        } else if (file.type.startsWith("image/") || IMAGE_EXT_RE.test(file.name)) {
          collected.push(file);
        }
      }

      const merged = [...imageFiles, ...collected];
      const uniqueMap = new Map();

      for (const file of merged) {
        uniqueMap.set(file.name, file);
      }

      imageFiles = Array.from(uniqueMap.values()).sort(naturalSort);

      setProgress(0, imageFiles.length);
      setStatus(imageFiles.length ? `已載入 ${imageFiles.length} 張圖片。` : "沒有找到可用的 PNG / JPG / JPEG 圖片。");
      renderFileList();
      updateButtons();
    }

    async function extractImagesFromZip(zipFile) {
      const zip = await JSZip.loadAsync(zipFile);
      const images = [];

      const entries = Object.values(zip.files)
        .filter(entry => !entry.dir && IMAGE_EXT_RE.test(entry.name))
        .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" }));

      for (const entry of entries) {
        const blob = await entry.async("blob");
        const cleanName = entry.name.split("/").pop();
        const type = /\.png$/i.test(cleanName) ? "image/png" : "image/jpeg";
        images.push(new File([blob], cleanName, { type }));
      }

      return images;
    }

    async function callOcrApi(file) {
      const apiUrl = apiUrlInput.value.trim();
      if (!apiUrl) {
        throw new Error("尚未填入 OCR 後端 API 網址。");
      }

      const formData = new FormData();
      formData.append("file", file, file.name);
      formData.append("lang", langModeSelect.value);
      formData.append("output_mode", outputModeSelect.value);

      const response = await fetch(apiUrl, {
        method: "POST",
        body: formData
      });

      if (!response.ok) {
        const errorText = await response.text().catch(() => "");
        throw new Error(`API 回應失敗：HTTP ${response.status} ${errorText}`);
      }

      const data = await response.json();

      if (typeof data.text === "string") {
        return data.text;
      }

      if (Array.isArray(data.lines)) {
        return data.lines.join("\n");
      }

      throw new Error("API 回傳格式不正確，預期需要 { text: string } 或 { lines: string[] }。");
    }

    function rowsToCsv(rows) {
      const header = ["檔名", "文字內容"];
      const allRows = [header, ...rows];

      return allRows.map(row => {
        return row.map(cell => {
          const value = String(cell ?? "");
          return `"${value.replaceAll('"', '""')}"`;
        }).join(",");
      }).join("\r\n");
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result));
        reader.onerror = () => reject(reader.error || new Error("圖片讀取失敗"));
        reader.readAsDataURL(file);
      });
    }

    async function startOcr() {
      if (!imageFiles.length) return;

      isCancelled = false;
      startBtn.disabled = true;
      cancelBtn.disabled = false;
      clearBtn.disabled = true;
      reportRows = [];

      const csvRows = [];
      const previewResults = [];
      const states = {};

      resultText.value = "";
      resultText.dataset.csv = "";
      setProgress(0, imageFiles.length);
      renderFileList(states);

      for (let i = 0; i < imageFiles.length; i++) {
        if (isCancelled) {
          setStatus(`已中止。已完成 ${i} / ${imageFiles.length} 張。`);
          break;
        }

        const file = imageFiles[i];
        states[file.name] = "辨識中";
        renderFileList(states);
        setStatus(`正在辨識：${file.name}\n進度：${i + 1} / ${imageFiles.length}`);

        try {
          const [text, imageDataUrl] = await Promise.all([
            callOcrApi(file),
            fileToDataUrl(file)
          ]);

          states[file.name] = "完成";

          const cleanText = text.trim() || "（未辨識出文字）";
          csvRows.push([file.name, cleanText]);
          reportRows.push({
            filename: file.name,
            text: cleanText,
            imageDataUrl,
            mimeType: file.type || (file.name.toLowerCase().endsWith(".png") ? "image/png" : "image/jpeg")
          });

          previewResults.push(
`檔名：${file.name}
文字內容：
${cleanText}

----------------------------------------
`
          );
        } catch (error) {
          states[file.name] = "失敗";

          const errorText = `辨識失敗：${error.message}`;
          csvRows.push([file.name, errorText]);
          reportRows.push({
            filename: file.name,
            text: errorText,
            imageDataUrl: "",
            mimeType: ""
          });

          previewResults.push(
`檔名：${file.name}
文字內容：
${errorText}

----------------------------------------
`
          );
        }

        resultText.value = previewResults.join("\n");
        resultText.dataset.csv = rowsToCsv(csvRows);
        setProgress(i + 1, imageFiles.length);
        renderFileList(states);
        updateButtons();
      }

      if (!isCancelled) {
        setStatus(`辨識完成。共處理 ${imageFiles.length} 張圖片。`);
      }

      startBtn.disabled = false;
      cancelBtn.disabled = true;
      clearBtn.disabled = false;
      updateButtons();
    }

    function downloadCsv() {
      const content = resultText.dataset.csv || "";
      if (!content.trim()) return;

      const blob = new Blob(["\ufeff" + content], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");

      a.href = url;
      a.download = `ocr_result_${timestampForFilename()}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function timestampForFilename() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, "0");
      const dd = String(now.getDate()).padStart(2, "0");
      const hh = String(now.getHours()).padStart(2, "0");
      const mi = String(now.getMinutes()).padStart(2, "0");
      return `${yyyy}${mm}${dd}_${hh}${mi}`;
    }

    async function downloadXlsx() {
      if (!reportRows.length) return;

      if (!window.ExcelJS) {
        setStatus("ExcelJS 載入失敗，無法產生 XLSX。請確認網路可連到 jsDelivr CDN。");
        return;
      }

      downloadXlsxBtn.disabled = true;
      setStatus("正在產生 Excel 報表，圖片較多時可能需要等待...");

      try {
        const workbook = new ExcelJS.Workbook();
        workbook.creator = "Image OCR Tool";
        workbook.created = new Date();

        const sheet = workbook.addWorksheet("OCR結果", {
          properties: { defaultRowHeight: 18 },
          views: [{ state: "frozen", ySplit: 1 }]
        });

        sheet.columns = [
          { header: "檔名", key: "filename", width: 32 },
          { header: "原檔圖片", key: "image", width: 28 },
          { header: "文字內容", key: "text", width: 70 }
        ];

        const headerRow = sheet.getRow(1);
        headerRow.height = 24;
        headerRow.eachCell(cell => {
          cell.font = { bold: true, color: { argb: "FFFFFFFF" } };
          cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF2563EB" } };
          cell.alignment = { vertical: "middle", horizontal: "center" };
          cell.border = {
            top: { style: "thin", color: { argb: "FFD1D5DB" } },
            left: { style: "thin", color: { argb: "FFD1D5DB" } },
            bottom: { style: "thin", color: { argb: "FFD1D5DB" } },
            right: { style: "thin", color: { argb: "FFD1D5DB" } }
          };
        });

        for (let i = 0; i < reportRows.length; i++) {
          const rowIndex = i + 2;
          const item = reportRows[i];
          const row = sheet.getRow(rowIndex);

          row.height = 120;
          row.getCell(1).value = item.filename;
          row.getCell(3).value = item.text;

          row.getCell(1).alignment = { vertical: "middle", wrapText: true };
          row.getCell(2).alignment = { vertical: "middle", horizontal: "center" };
          row.getCell(3).alignment = { vertical: "top", wrapText: true };

          for (let col = 1; col <= 3; col++) {
            row.getCell(col).border = {
              top: { style: "thin", color: { argb: "FFE5E7EB" } },
              left: { style: "thin", color: { argb: "FFE5E7EB" } },
              bottom: { style: "thin", color: { argb: "FFE5E7EB" } },
              right: { style: "thin", color: { argb: "FFE5E7EB" } }
            };
          }

          if (item.imageDataUrl) {
            const extension = item.mimeType.includes("png") ? "png" : "jpeg";
            const imageId = workbook.addImage({
              base64: item.imageDataUrl,
              extension
            });

            sheet.addImage(imageId, {
              tl: { col: 1.15, row: rowIndex - 0.85 },
              ext: { width: 150, height: 105 },
              editAs: "oneCell"
            });
          }
        }

        sheet.autoFilter = {
          from: { row: 1, column: 1 },
          to: { row: 1, column: 3 }
        };

        const buffer = await workbook.xlsx.writeBuffer();
        const blob = new Blob([buffer], {
          type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");

        a.href = url;
        a.download = `ocr_report_${timestampForFilename()}.xlsx`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        setStatus("Excel 報表已產生。");
      } catch (error) {
        setStatus(`Excel 報表產生失敗：${error.message}`);
      } finally {
        downloadXlsxBtn.disabled = false;
        updateButtons();
      }
    }

    async function copyResult() {
      if (!resultText.value.trim()) return;
      await navigator.clipboard.writeText(resultText.value);
      setStatus("已複製預覽結果。");
    }

    function clearAll() {
      imageFiles = [];
      reportRows = [];
      resultText.value = "";
      resultText.dataset.csv = "";
      isCancelled = false;
      fileInput.value = "";
      setProgress(0, 0);
      setStatus("尚未選擇檔案。");
      renderFileList();
      updateButtons();
    }

    dropzone.addEventListener("click", () => fileInput.click());

    dropzone.addEventListener("dragover", event => {
      event.preventDefault();
      dropzone.classList.add("dragover");
    });

    dropzone.addEventListener("dragleave", () => {
      dropzone.classList.remove("dragover");
    });

    dropzone.addEventListener("drop", async event => {
      event.preventDefault();
      dropzone.classList.remove("dragover");
      await handleFiles(event.dataTransfer.files);
    });

    fileInput.addEventListener("change", async event => {
      await handleFiles(event.target.files);
    });

    startBtn.addEventListener("click", startOcr);
    clearBtn.addEventListener("click", clearAll);
    cancelBtn.addEventListener("click", () => {
      isCancelled = true;
      cancelBtn.disabled = true;
    });
    downloadBtn.addEventListener("click", downloadCsv);
    downloadXlsxBtn.addEventListener("click", downloadXlsx);
    copyBtn.addEventListener("click", copyResult);
    resultText.addEventListener("input", updateButtons);

    updateButtons();
  </script>
</body>
</html>
